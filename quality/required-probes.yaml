# Release-required probes — the machine-readable manifest (plan Phase 3, template A3/D05).
#
# This file is the source of truth for what "required" means at release time.
# scripts/release/analyze-release-run.ts fails a release when any probe listed
# here is missing, failed, or skipped, and scripts/release/required-probes.ts
# asserts that the Playwright projects select exactly the probes named here —
# so a probe cannot be quietly dropped by editing one side only.
#
# tier:
#   deployed-readonly — runs against the deployed origin. MUST NOT mutate.
#                       Preview shares the production Supabase project and holds
#                       live-mode Stripe keys (plan D-B).
#   local-docker      — mutating. Runs only against the local Docker stack.
#   local             — static/offline check. No environment needed.
#
# oracles: what counts as evidence the probe actually observed something.
#   http | ui | datastore | cleanup | static | identity
#
# safety: read-only | mutating-local
#
# Every probe must fail closed when its prerequisites are absent. A required
# probe that skips is a vacuous pass — the exact failure this wave removes.

version: 1

probes:
  - id: candidate-identity
    title: Deployed candidate identity matches the expected tree
    owner: release
    tier: deployed-readonly
    safety: read-only
    runner:
      kind: script
      command: npx tsx scripts/release/candidate-identity.ts --verify
    oracles: [identity]
    notes: >-
      Binds the release to a tree hash rather than a commit SHA. The promotion
      merge has a new SHA but must preserve the tested tree (plan D-A).

  - id: health-status
    title: "/api/health returns 200 and status healthy"
    owner: release
    tier: deployed-readonly
    safety: read-only
    runner:
      kind: playwright
      project: release-required
      selector: "@release-required health-status"
    oracles: [http]

  - id: health-db
    title: "/api/health/db is reachable and well-formed"
    owner: release
    tier: deployed-readonly
    safety: read-only
    runner:
      kind: playwright
      project: release-required
      selector: "@release-required health-db"
    oracles: [http]

  - id: elevenlabs-voice-preflight
    title: ElevenLabs runtime credential and five owned agents are reachable
    owner: voice
    tier: deployed-readonly
    safety: read-only
    runner:
      kind: script
      command: npm run check-elevenlabs-voice
    oracles: [http]
    notes: >-
      Authenticated with HEALTH_PROBE_SECRET. Requests and discards signed URLs
      for all five owned agents, then records only the safe key fingerprint,
      binding state, agent keys, custom-LLM not-applicable state, and the exact
      target, commit, deployment, and check time.

  - id: csp-canary
    title: Homepage renders and client JS executes
    owner: release
    tier: deployed-readonly
    safety: read-only
    runner:
      kind: playwright
      project: release-required
      selector: "@release-required csp-canary"
    oracles: [ui]
    notes: >-
      Catches a CSP regression that blocks hydration — see the PPR/nonce
      constraints in CLAUDE.md.

  - id: story-read-path
    title: The story page serves real content
    owner: release
    tier: deployed-readonly
    safety: read-only
    runner:
      kind: playwright
      project: release-required
      selector: "@release-required story-read-path"
    oracles: [http, ui]

  - id: admin-denial
    title: Admin route denies an unauthenticated caller
    owner: release
    tier: deployed-readonly
    safety: read-only
    runner:
      kind: playwright
      project: release-required
      selector: "@release-required admin-denial"
    oracles: [http]

  - id: webhook-unsigned
    title: Webhook rejects an unsigned payload
    owner: release
    tier: deployed-readonly
    safety: read-only
    runner:
      kind: playwright
      project: release-required
      selector: "@release-required webhook-unsigned"
    oracles: [http]
    notes: >-
      Read-only in effect: the payload is rejected before any handler side
      effect.

  - id: chat-smoke
    title: Chat/RAG pipeline responds with retrieved sources
    owner: release
    tier: deployed-readonly
    safety: read-only
    runner:
      kind: playwright
      project: release-required
      selector: "@release-required chat-smoke"
    oracles: [http]
    notes: >-
      QA-H2 (#869): full rationale in scripts/release/chat-smoke.ts's module
      docblock. Consumes real Anthropic + Voyage credits per run, so this
      selector belongs solely to the release-required Playwright project,
      never desktop/mobile (which build with dummy Anthropic/Voyage keys —
      see playwright.config.ts webServer.env).

  - id: booking-gate-closed
    title: Unknown booking capability is 404 and /acceso follows the experience_booking flag
    owner: booking
    tier: deployed-readonly
    safety: read-only
    runner:
      kind: playwright
      project: release-required
      selector: "@release-required booking-gate-closed"
    oracles: [http, ui]
    notes: >-
      PayPal hackathon plan, Phase 6 (F10). A route check only: a 404 for a
      capability that does not exist does not prove the access boundary
      (booking-access-boundary does, on local Docker). Three GETs. Reads the
      deployed experience_booking flag from /api/feature-flags: on, /acceso
      renders the code form; off, /acceso is a real 404. Holds before and after
      the release turns the flag on.

  - id: booking-access-boundary
    title: Booking capability, ownership, redemption and Preview gates hold with valid fixtures
    owner: booking
    tier: local-docker
    safety: mutating-local
    runner:
      kind: playwright
      project: release-required-local
      selector: "@release-required @local-docker booking-access-boundary"
    oracles: [http, cleanup]
    notes: >-
      F10. A valid capability with no cookies opens its booking (a wrong token
      does not); another user's booking id is not_found in the chat tools; a
      session without a redemption is 404 on the chat and access routes; the
      same requests against a local VERCEL_ENV=preview server are 404. The
      chat model is the scripted replay (BOOKING_AGENT_REPLAY), the tools are
      real. Every created row is deleted and the deletion verified.

  - id: booking-roundtrip
    title: Voucher, chat, accept, PayPal approval, return, confirmed, operator view, cancel, refunded
    owner: booking
    tier: local-docker
    safety: mutating-local
    runner:
      kind: playwright
      project: release-required-local
      selector: "@release-required @local-docker booking-roundtrip"
    oracles: [ui, datastore, cleanup]
    notes: >-
      The whole journey in the browser against next dev, the PayPal stand-in
      (src/test/paypal-mock-server.ts, started by e2e/booking-global-setup.ts;
      the sandbox approval page is answered by the test, never requested) and
      the scripted replay model. Confirmed and refunded are read back from
      Postgres; the cleanup oracle deletes the run's rows and verifies it.

  - id: favorite-roundtrip
    title: Favorite create, datastore read-back, cleanup
    owner: release
    tier: local-docker
    safety: mutating-local
    runner:
      kind: playwright
      project: release-required-local
      selector: "@release-required @local-docker favorite-roundtrip"
    oracles: [ui, datastore, cleanup]
    notes: >-
      Mutating, like the two local booking probes. The spec refuses to run
      unless NEXT_PUBLIC_SUPABASE_URL points at localhost.

  - id: migration-posture
    title: Migration posture lint
    owner: release
    tier: local
    safety: read-only
    runner:
      kind: script
      command: npm run check-migrations
    oracles: [static]
