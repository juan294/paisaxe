# Upptime monitoring configuration for Paisaxe
#
# Live repo: https://github.com/juan294/paisaxe-upptime
# Status page: https://juan294.github.io/paisaxe-upptime/
#
# This file is a reference copy. The live configuration is in the Upptime repo.
# For full documentation, see: https://upptime.js.org/docs/

owner: juan294
repo: paisaxe-upptime

sites:
  - name: Paisaxe (Main Site)
    url: https://paisaxe.es
    method: GET
    expectedStatusCode: 200

  - name: Paisaxe API Health
    url: https://paisaxe.es/api/health
    method: GET
    # Healthy state returns HTTP 200; degraded state intentionally returns HTTP 503.
    # Upptime expects 200 here — a 503 will open an incident automatically,
    # surfacing any Supabase outage, zero approved stories, or DB capacity alert
    # without requiring manual investigation.
    expectedStatusCode: 200

status-website:
  baseUrl: /paisaxe-upptime
  name: Paisaxe Status

workflowSchedule:
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updateTemplate: "0 0 * * *"
  updates: "*/5 * * * *"
  uptime: "*/5 * * * *"
