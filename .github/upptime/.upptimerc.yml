# Upptime monitoring configuration for Paisaxe
#
# Live repo: https://github.com/juan294/paisaxe-upptime
# Status page: https://juan294.github.io/paisaxe-upptime/
#
# This file is a reference copy. The live configuration is in the Upptime repo.
# For full documentation, see: https://upptime.js.org/docs/

owner: juan294
repo: paisaxe-upptime

sites:
  - name: Paisaxe (Main Site)
    url: https://paisaxe.es
    method: GET
    expectedStatusCode: 200

  - name: Paisaxe API Health (Liveness)
    url: https://paisaxe.es/api/health/live
    method: GET
    # Lightweight liveness probe — always returns HTTP 200 with {"status":"live"}.
    # No backend probes are run. This is the correct endpoint for uptime monitors
    # because it never returns 503 regardless of DB/stories state (DO-B1 fix).
    expectedStatusCode: 200

status-website:
  baseUrl: /paisaxe-upptime
  name: Paisaxe Status

workflowSchedule:
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updateTemplate: "0 0 * * *"
  updates: "*/5 * * * *"
  uptime: "*/5 * * * *"
