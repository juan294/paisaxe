name: Enhancement
description: Improve an existing feature
labels: ["type: enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe how an existing feature could be improved.

  - type: textarea
    id: current
    attributes:
      label: Current Behavior
      description: How does the feature work today?
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed Improvement
      description: What should change and why?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the system is affected?
      options:
        - Chat (text chat, RAG, Claude API)
        - Voice (ElevenLabs, Pelayo)
        - Payments (Stripe, day pass)
        - Admin (dashboard, analytics)
        - Content (PDFs, embeddings, stories)
        - Infrastructure (CI, Vercel, Supabase)
        - Marketing (SEO, social media)
        - Authentication (login, OAuth)
        - UX (design, accessibility)
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this improvement?
      options:
        - High (significant user impact)
        - Medium (noticeable improvement)
        - Low (polish, nice to have)
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, examples, or related issues.
