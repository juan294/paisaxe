version: 2

updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    ignore:
      # voyageai v0.2.x has a broken ESM build (bare dir imports that Turbopack
      # cannot resolve). Pin to 0.1.x until upstream fixes it.
      - dependency-name: "voyageai"
        versions: [">= 0.2.0"]
    groups:
      # Both groups are restricted to minor/patch so a major version bump
      # (e.g. typescript 6->7) always arrives as its own standalone PR
      # instead of silently riding along with unrelated safe updates and
      # failing every downstream CI check. This is semver-based, not a
      # per-package allowlist — it holds for the next major bump in any
      # package, not just the one that broke a batch this cycle.
      production:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
          - "eslint*"
          - "vitest*"
          - "@vitest/*"
          - "@testing-library/*"
      dev-and-types:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns:
          - "@types/*"
          - "eslint*"
          - "vitest*"
          - "@vitest/*"
          - "@testing-library/*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
