name: Update Visual Baselines

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to update baselines on'
        required: true
        default: 'develop'

jobs:
  update-baselines:
    name: Regenerate Visual Baselines
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install canvas system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libpixman-1-dev

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build application
        run: npm run build
        env:
          ANTHROPIC_API_KEY: dummy_key_for_build
          VOYAGE_API_KEY: dummy_key_for_build
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_key_for_build

      - name: Update visual baselines
        run: npm run test:e2e:visual:update
        env:
          CI: true
          ANTHROPIC_API_KEY: dummy_key_for_e2e
          VOYAGE_API_KEY: dummy_key_for_e2e
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_key_for_e2e
          MAINTENANCE_MODE: "false"
          STRIPE_SECRET_KEY: sk_test_dummy_for_e2e
          STRIPE_DAY_PASS_PRICE_ID: price_test_dummy_for_e2e

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit updated baselines
        run: |
          git add e2e/visual-regression.spec.ts-snapshots/
          if git diff --cached --quiet; then
            echo "No baseline changes detected"
          else
            git commit -m "chore: update visual regression baselines [skip ci]"
            git push origin ${{ github.event.inputs.branch }}
          fi
