name: CI cadence
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
concurrency:
  group: B-cadence-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  entry:
    name: CI Fast
    outputs:
      decision: ${{ steps.routing.outputs.full == 'false' && !((github.event_name == 'push' && github.event.head_commit.author.username != 'juan294')) && 'skip' || 'originals' }}
      full: ${{ steps.routing.outputs.full }}
      reason: ${{ steps.routing.outputs.reason }}
      source_sha: ${{ steps.entry.outputs.source_sha }}
      checkout_sha: ${{ steps.entry.outputs.checkout_sha }}
      definition_sha: ${{ steps.entry.outputs.definition_sha }}
    if: github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && ((github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'develop'))
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout actual native candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup reviewed Node runtime
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Plan automatic verification
        id: routing
        shell: bash
        run: |-
          set -euo pipefail
          # Ignore ambient Git redirection and never execute a candidate routing helper.
          for name in ${!GIT_@}; do unset "$name"; done
          git_read() { git --no-replace-objects -c core.hooksPath=/dev/null -c core.fsmonitor=false "$@"; }
          printf 'full=true\n' >> "$GITHUB_OUTPUT"
          base=""
          case "$GITHUB_EVENT_NAME" in
            push) base=$(jq -r '.before' "$GITHUB_EVENT_PATH") ;;
            pull_request)
              head=$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")
              test "$(git_read rev-parse HEAD^2)" = "$head" || { echo 'Sutura: PR head/merge parent mismatch' >&2; exit 1; }
              base=$(git_read rev-parse HEAD^1)
              ;;
            *) base=$(git_read rev-parse HEAD) ;;
          esac
          [[ "$base" =~ ^[0-9a-f]{40}$ && "$base" != 0000000000000000000000000000000000000000 ]] || { echo 'Sutura: protected base unavailable; full verification remains required. Bring this run to Sutura.' >&2; exit 1; }
          protected=$(mktemp -d)
          trap 'status=$?; if [ "$status" -ne 0 ]; then printf "full=true\n" >> "$GITHUB_OUTPUT"; fi; rm -rf "$protected"; exit "$status"' EXIT
          if git_read cat-file -e "$base:scripts/ci-routing-v2.mjs" 2>/dev/null; then
            git_read show "$base:scripts/ci-routing-v2.mjs" > "$protected/ci-routing-v2.mjs"
            node "$protected/ci-routing-v2.mjs" --base "$base"
          else
            printf 'reason=installation-missing\n' >> "$GITHUB_OUTPUT"
            echo 'Sutura protected routing v2 is not installed yet. Running full verification automatically; no mode change is needed.'
          fi
      - name: Acquire reviewed protected launcher
        id: entry
        env:
          LAUNCHER_SHA256: fd64de89d018b0d1b20136a3cbe8fe743ed67ebcf33f52ef003de741b1908601
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unset NODE_OPTIONS NODE_PATH
          while IFS= read -r name; do unset "$name"; done < <(compgen -v | sed -n '/^GIT_/p')
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_NO_REPLACE_OBJECTS=1 GIT_GRAFT_FILE=/dev/null
          export GIT_TERMINAL_PROMPT=0
          definition="$(python3 - <<'PY'
          import json, os, re
          with open(os.environ['GITHUB_EVENT_PATH']) as source:
              event = json.load(source)
          kind = os.environ['GITHUB_EVENT_NAME']
          # event.before and pull_request.base.sha are native immutable identities.
          definition = event['before'] if kind == 'push' else event['pull_request']['base']['sha']
          if not re.fullmatch('[a-f0-9]{40}', definition):
              raise SystemExit('invalid protected definition')
          print(definition)
          PY
          )"
          private="$(mktemp -d "$RUNNER_TEMP/cadence-bootstrap.XXXXXXXX")"
          chmod 700 "$private"
          trap 'rm -rf "$private"' EXIT
          # No network: the full-history checkout already holds the push `before`
          # commit and the pull request base. Absence means a force-push or a
          # shallow checkout, and nothing trusted can be read.
          if ! git --no-replace-objects cat-file -e "$definition^{commit}" 2>/dev/null; then
            reason="protected base $definition is not in this checkout (force-push or shallow history); CI Fast cannot read its trusted definition. Push a commit on top of the current develop."
            echo "::error title=CI Fast::$reason"
            echo "$reason" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # A v2 fast disposition still requires the bounded native verifier.
          # Missing or changed protected code fails closed; full routing uses originals.
          git --no-replace-objects show "$definition:scripts/ci-cadence-launch.mjs" > "$private/launch.mjs"
          chmod 600 "$private/launch.mjs"
          printf '%s  %s\n' "$LAUNCHER_SHA256" "$private/launch.mjs" | sha256sum --check --status
          node "$private/launch.mjs" > "$private/result.json"
          python3 - "$private/result.json" <<'PYTHON'
          import json,os,re,sys
          with open(sys.argv[1]) as f: result=json.load(f)
          required=['commit-secret-scan','policy-validation','lockfile-validation','cadence-contracts']
          if not (result.get('lane')=='fast' and result.get('success') is True and result.get('completed')==required):
              raise SystemExit('Protected bounded native verification unavailable; bring this run to Sutura')
          values={'decision':'skip','source_sha':result.get('sourceSha'),'checkout_sha':result.get('testedCheckoutSha'),'definition_sha':result.get('definitionSha')}
          for key in ['source_sha','checkout_sha','definition_sha']:
              assert re.fullmatch('[a-f0-9]{40}',values[key] or '')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for key,value in values.items(): f.write(key+'='+value+'\n')
          PYTHON
        if: steps.routing.outputs.full == 'false' && !((github.event_name == 'push' && github.event.head_commit.author.username != 'juan294'))
    permissions:
      contents: read
  complete:
    name: CI Fast recovery
    needs:
      - entry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    if: ${{ always() && github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && ((github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'develop')) }}
    steps:
      - name: Require automatic original-workflow disposition
        env:
          ENTRY: ${{ needs.entry.result }}
          DECISION: ${{ needs.entry.outputs.decision }}
        run: |
          set -euo pipefail
          test "$ENTRY" = success
          case "$DECISION" in
           skip) echo "Protected bounded verification passed; application full work is not required." ;;
           originals) echo "Full application verification belongs to separately required CI Verification gates in the original workflows. This policy disposition is not application or release evidence." ;;
           *) exit 1 ;;
          esac
