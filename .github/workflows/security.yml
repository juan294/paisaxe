name: Security Scan

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    # Run daily at 8:00 UTC (was weekly — CVE detection latency reduced from ~6 days to <24h)
    - cron: '0 8 * * *'

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          wget -q "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          chmod +x gitleaks

      - name: Run Gitleaks
        run: ./gitleaks detect --source . --verbose

  audit:
    name: npm audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit (production deps)
        # Only audit production dependencies at high level.
        # Dev-only vulnerabilities (e.g. minimatch ReDoS in eslint) don't affect
        # the deployed application and are tracked separately.
        run: npm audit --omit=dev --audit-level=high

      - name: Report all vulnerabilities (informational)
        if: always()
        run: npm audit || true

  vercel-env-safety:
    name: Vercel env safety
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Skip when Vercel token is unavailable
        if: ${{ env.VERCEL_TOKEN == '' }}
        run: echo "VERCEL_TOKEN is not configured; skipping Vercel env safety check."

      - name: Checkout code
        if: ${{ env.VERCEL_TOKEN != '' }}
        uses: actions/checkout@v6

      - name: Load Vercel project metadata
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: |
          echo "VERCEL_PROJECT_ID=$(jq -r '.projectId' .vercel/project.json)" >> "$GITHUB_ENV"
          echo "VERCEL_ORG_ID=$(jq -r '.orgId' .vercel/project.json)" >> "$GITHUB_ENV"

      - name: Assert legacy agent override is absent from Vercel env
        if: ${{ env.VERCEL_TOKEN != '' }}
        env:
        run: |
          legacy_key="$(printf '%s_%s_%s\n' ALLOW AGENT RUN)"
          response="$(curl -fsS \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID&limit=100")"

          echo "$response" | jq -r '.envs[]?.key' > env-keys.txt

          if grep -Fxq "$legacy_key" env-keys.txt; then
            echo "::error::Legacy agent runner override is still configured in Vercel. Remove it before deploy."
            exit 1
          fi
