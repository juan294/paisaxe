name: Security Scan

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    # Run weekly on Mondays at 8:00 UTC
    - cron: '0 8 * * 1'

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  audit:
    name: npm audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit (production deps)
        # Only audit production dependencies at high level.
        # Dev-only vulnerabilities (e.g. minimatch ReDoS in eslint) don't affect
        # the deployed application and are tracked separately.
        run: npm audit --omit=dev --audit-level=high

      - name: Report all vulnerabilities (informational)
        if: always()
        run: npm audit || true
