name: Security Scan

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    # Run weekly on Mondays at 8:00 UTC
    - cron: '0 8 * * 1'

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.18.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        # Raised to high after adding qs override in package.json (Fixes #93).
        # Previous blocker: voyageai → qs <6.14.1 (GHSA-6rw7-vpxm-498p, high severity).
        run: npm audit --audit-level=high
