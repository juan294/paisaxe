          RESULT_1: ${{ needs.e2e.result }}
          RESULT_2: ${{ needs.visual-regression.result }}
        run: |
          set -euo pipefail
          for result in "$RESULT_0" "$RESULT_1" "$RESULT_2"; do
            test "$result" = success || { echo "::error::Required callable child did not succeed."; exit 1; }
          done
