name: CI

# NOTE: This workflow builds/tests with dummy env vars.
# It catches compile errors, unit-test failures, and type regressions.
# It does NOT exercise the real Vercel runtime or real backend services.
#
# For PRs targeting main, a SEPARATE required check runs:
#   .github/workflows/preview-smoke.yml  — "Smoke test Vercel preview"
# That workflow waits for the Vercel preview deployment and hits
# /api/health + homepage against real env vars, catching runtime failures
# that dummy-key builds cannot detect (see incident: Next.js 16.2.1).
# The health probe fails on non-200 or JSON status != "healthy".
#
# DO-M5: On direct `develop` pushes (the default dev workflow), a
# lightweight runtime smoke check runs after build, hitting /api/health
# and /api/health/live on the Vercel preview for the pushed commit.
# This catches the same class of Dependabot-style regressions that the
# 2026-03-24 incident exposed (broken build not caught until PR time).
# The smoke job uses continue-on-error: true — it never blocks the push,
# but failures are visible in the CI summary and GH notification emails.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install canvas system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libpixman-1-dev

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Check verification coverage wiring
        run: npm run check-verification-coverage

      - name: Run lint
        run: npm run lint

      - name: Check env vars documented
        run: npm run check-env

      - name: Validate migrations
        run: npm run check-migrations

      - name: Check circular dependencies
        run: npm run lint:deps

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install canvas system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libpixman-1-dev

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install canvas system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libpixman-1-dev

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install canvas system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libpixman-1-dev

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Dummy values for build (APIs not called during build)
          ANTHROPIC_API_KEY: dummy_key_for_build
          VOYAGE_API_KEY: dummy_key_for_build
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_key_for_build

  # -----------------------------------------------------------------------
  # DO-M5: Lightweight runtime smoke check for direct `develop` pushes.
  #
  # Waits for the Vercel preview deployment created by the push, then hits
  # /api/health and /api/health/live to verify the real runtime is healthy.
  #
  # Uses continue-on-error: true — a smoke failure is surfaced in the CI
  # summary and via GitHub notification email, but never blocks the push.
  # This mirrors how we catch runtime regressions on main (preview-smoke.yml)
  # but applies to every develop push, not just PRs.
  #
  # Required secrets (already configured):
  #   VERCEL_AUTOMATION_BYPASS_SECRET — bypass Vercel preview protection
  # -----------------------------------------------------------------------
  develop-smoke:
    name: Develop smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only run on direct develop pushes — not PRs, not main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [build]
    # Never block the push — surface failures visibly but don't fail the run.
    continue-on-error: true

    permissions:
      contents: read
      deployments: read
      statuses: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Wait for Vercel preview deployment
        id: vercel-wait
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          echo "Looking for Vercel preview deployment for commit $HEAD_SHA"
          for attempt in $(seq 1 20); do
            deployment_id=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/deployments" \
              -f sha="$HEAD_SHA" \
              --jq '[.[] | select(.creator.login == "vercel[bot]" and .environment == "Preview")][0].id // empty')

            if [ -n "$deployment_id" ]; then
              state=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
                --jq '.[0].state // empty')
              preview_url=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
                --jq '.[0].environment_url // .[0].target_url // empty')
              echo "Vercel deployment state: ${state:-unknown}"

              if [ "$state" = "success" ] && [ -n "$preview_url" ]; then
                echo "url=$preview_url" >> "$GITHUB_OUTPUT"
                echo "vercel_outcome=success" >> "$GITHUB_OUTPUT"
                echo "Preview URL: $preview_url"
                exit 0
              fi

              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
                echo "::warning::Vercel preview deployment FAILED (state=$state) — smoke probes skipped. Check Vercel dashboard for build logs."
                echo "## Develop Smoke Check" >> "$GITHUB_STEP_SUMMARY"
                echo ":x: **Vercel preview deployment failed** (state=\`$state\`). Smoke probes were not run." >> "$GITHUB_STEP_SUMMARY"
                echo "Check the [Vercel dashboard](https://vercel.com/dashboard) for build error details." >> "$GITHUB_STEP_SUMMARY"
                echo "url=" >> "$GITHUB_OUTPUT"
                echo "vercel_outcome=failed" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo "No Vercel preview deployment found yet (attempt $attempt / 20)"
            fi

            sleep 15
          done

          echo "::warning::Timed out waiting for Vercel preview deployment after 5 minutes — smoke probes skipped. Verify the deployment manually."
          echo "## Develop Smoke Check" >> "$GITHUB_STEP_SUMMARY"
          echo ":warning: **Vercel preview deployment timed out** after 5 minutes. Smoke probes were not run." >> "$GITHUB_STEP_SUMMARY"
          echo "Verify the deployment at the [Vercel dashboard](https://vercel.com/dashboard) manually." >> "$GITHUB_STEP_SUMMARY"
          echo "url=" >> "$GITHUB_OUTPUT"
          echo "vercel_outcome=timeout" >> "$GITHUB_OUTPUT"

      - name: Smoke check - liveness endpoint
        if: steps.vercel-wait.outputs.url != ''
        id: smoke-live
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          PREVIEW_URL="${{ steps.vercel-wait.outputs.url }}"
          echo "Testing: $PREVIEW_URL/api/health/live"
          response=$(curl -sS \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            "$PREVIEW_URL/api/health/live" \
            -o /tmp/live.json -w "%{http_code}")
          if [ "$response" != "200" ]; then
            echo "::warning::Smoke probe FAILED: /api/health/live returned HTTP $response on $PREVIEW_URL"
            echo "## Develop Smoke Check" >> "$GITHUB_STEP_SUMMARY"
            echo ":x: **Liveness probe failed**: \`/api/health/live\` returned HTTP $response on \`$PREVIEW_URL\`" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/live.json
            exit 1
          fi
          echo "Liveness check passed (HTTP 200)"
          cat /tmp/live.json

      - name: Smoke check - health endpoint
        if: steps.vercel-wait.outputs.url != ''
        id: smoke-health
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          PREVIEW_URL="${{ steps.vercel-wait.outputs.url }}"
          if node scripts/check-health-readiness.mjs "$PREVIEW_URL"; then
            echo "## Develop Smoke Check" >> "$GITHUB_STEP_SUMMARY"
            echo ":white_check_mark: **Smoke probes passed** — \`/api/health/live\` and \`/api/health\` returned healthy on \`$PREVIEW_URL\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Smoke probe FAILED: /api/health returned unhealthy on $PREVIEW_URL — check Sentry/logs for runtime errors."
            echo "## Develop Smoke Check" >> "$GITHUB_STEP_SUMMARY"
            echo ":x: **Health probe failed**: \`/api/health\` returned unhealthy on \`$PREVIEW_URL\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Check Sentry and Vercel function logs for runtime errors." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
