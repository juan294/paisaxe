name: CI
on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact admitted app checkout, distinct from caller definition.
        required: true
        type: string
      profile:
        description: Isolated full or nightly app work.
        required: true
        type: string
      invocation_id:
        description: Unique caller job ID, safe ASCII and at most 64 characters.
        required: true
        type: string
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - docs/**
      - README.md
      - CHANGELOG.md
      - ROADMAP.md
      - AGENTS.md
  pull_request:
    branches:
      - develop
      - main
concurrency:
  group: ${{ inputs.profile == '' && inputs.source_sha == '' && inputs.invocation_id == '' && (github.event_name == 'push' || github.event_name == 'pull_request') && github.workflow_ref == format('juan294/paisaxe/.github/workflows/ci.yml@{0}', github.ref) && format('{0}-{1}', github.workflow, github.ref) || format('paisaxe-ci-full-call-{0}-{1}-{2}', github.run_id, github.run_attempt, inputs.invocation_id) }}
  cancel-in-progress: ${{ inputs.profile == '' && inputs.source_sha == '' && inputs.invocation_id == '' && (github.event_name == 'push' || github.event_name == 'pull_request') && github.workflow_ref == format('juan294/paisaxe/.github/workflows/ci.yml@{0}', github.ref) && github.ref != 'refs/heads/main' }}
jobs:
  develop_push_source:
    if: ${{ always() && (!(vars.CI_CADENCE_MODE == 'lean' && github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && ((github.event_name == 'schedule' && github.ref == 'refs/heads/main') || (github.actor_id == '3944118' && github.event.sender.type == 'User' && ((github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'develop' && github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326)))))) && (inputs.profile == '' && inputs.source_sha == '' && inputs.invocation_id == '' && (github.event_name == 'push' || github.event_name == 'pull_request') && github.workflow_ref == format('juan294/paisaxe/.github/workflows/ci.yml@{0}', github.ref) && (github.event_name == 'push' && github.ref == 'refs/heads/develop')) }}
    permissions:
      contents: read
      pull-requests: read
      checks: read
    uses: ./.github/workflows/validate-merged-pr.yml
    with:
      required_checks: '["Lint & Typecheck","Test","Build"]'
  lint-and-typecheck:
    name: Lint & Typecheck
    needs:
      - develop_push_source
      - callable-source
    if: ${{ always() && (((inputs.profile == 'full' || inputs.profile == 'nightly') && inputs.source_sha != '' && inputs.invocation_id != '') || !(vars.CI_CADENCE_MODE == 'lean' && github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && ((github.event_name == 'schedule' && github.ref == 'refs/heads/main') || (github.actor_id == '3944118' && github.event.sender.type == 'User' && ((github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'develop' && github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326)))))) && (always() && ((inputs.profile == '' && inputs.source_sha == '' && inputs.invocation_id == '' && (github.event_name == 'push' || github.event_name == 'pull_request') && github.workflow_ref == format('juan294/paisaxe/.github/workflows/ci.yml@{0}', github.ref) && needs.develop_push_source.outputs.validated_by_pr != 'true') || ((inputs.profile == 'full' || inputs.profile == 'nightly') && needs.callable-source.result == 'success'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify callable source checkout
        if: ${{ !(inputs.profile == '' && inputs.source_sha == '' && inputs.invocation_id == '' && (github.event_name == 'push' || github.event_name == 'pull_request') && github.workflow_ref == format('juan294/paisaxe/.github/workflows/ci.yml@{0}', github.ref)) && needs.callable-source.result == 'success' }}
        shell: /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS -u LD_PRELOAD -u LD_LIBRARY_PATH /bin/bash --noprofile --norc -p -e -o pipefail {0}
        env:
          BASH_ENV: ""
          ENV: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          LD_ORIGIN_PATH: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
          PYTHONSTARTUP: ""
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I - <<'PY'
          import os,re,stat,subprocess,hashlib
          from pathlib import Path
          root=Path.cwd().resolve()
          expected=os.environ.get('SOURCE_SHA','')
          assert re.fullmatch('[a-f0-9]{40}',expected) and expected!='0'*40
          metadata=root/'.git'
          assert metadata.is_dir() and not metadata.is_symlink()
          env={'PATH':'/usr/bin:/bin','GIT_CONFIG_NOSYSTEM':'1','GIT_CONFIG_GLOBAL':'/dev/null','GIT_NO_REPLACE_OBJECTS':'1','GIT_GRAFT_FILE':'/dev/null'}
          def git(*args):
           return subprocess.check_output(['/usr/bin/git','--no-replace-objects','--git-dir='+str(metadata),'--work-tree='+str(root),'-c','core.useReplaceRefs=false','-c','core.hooksPath=/dev/null','-c','core.fsmonitor=false','-c','core.ignoreCase=false','-c','core.attributesFile=/dev/null',*args],cwd=root,env=env,timeout=10)
          assert git('rev-parse','--show-object-format').strip()==b'sha1'
          assert git('rev-parse','--verify','HEAD').strip().decode()==expected
          assert not (metadata/'info/grafts').exists()
          assert not git('for-each-ref','--format=%(refname)','refs/replace').strip()
          committed={}
          for entry in git('ls-tree','-rz','--full-tree',expected).split(b'\0'):
           if not entry:continue
           fields,name=entry.split(b'\t',1);mode,kind,oid=fields.split()
           assert kind==b'blob' and mode in (b'100644',b'100755',b'120000')
           assert name and not name.startswith(b'/') and all(part not in (b'',b'.',b'..',b'.git') for part in name.split(b'/'))
           committed[name]=(mode,oid)
          index={}
          for entry in git('ls-files','--stage','-z').split(b'\0'):
           if not entry:continue
           fields,name=entry.split(b'\t',1);mode,oid,stage=fields.split()
           assert stage==b'0' and name not in index
           index[name]=(mode,oid)
          assert committed==index
          for entry in git('ls-files','-v','-z').split(b'\0'):
           if entry:assert entry[:2]==b'H '
          assert not git('ls-files','--others','--exclude-standard','-z')
          for name,(mode,oid) in committed.items():
           path=root/os.fsdecode(name)
           parent=path.parent
           while parent!=root:
            assert parent.is_dir() and not parent.is_symlink();parent=parent.parent
           before=path.lstat()
           if mode==b'120000':
            assert stat.S_ISLNK(before.st_mode);data=os.fsencode(os.readlink(path))
           else:
            assert stat.S_ISREG(before.st_mode) and before.st_nlink==1 and bool(before.st_mode&0o111)==(mode==b'100755') and before.st_size<=134217728
            with open(path,'rb') as source:data=source.read(134217729)
            assert len(data)==before.st_size
           after=path.lstat()
           assert (before.st_dev,before.st_ino,before.st_mode,before.st_size,before.st_mtime_ns)==(after.st_dev,after.st_ino,after.st_mode,after.st_size,after.st_mtime_ns)
           assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest().encode()==oid
          assert git('rev-parse','--verify','HEAD').strip().decode()==expected
          PY
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install canvas system dependencies
        uses: ./.github/actions/install-canvas-deps
      - name: Install dependencies
        run: npm ci
      - name: Run typecheck
        run: npm run typecheck
      - name: Check verification coverage wiring
        run: npm run check-verification-coverage
      - name: Run lint
        run: npm run lint
      - name: Check env vars documented
        run: npm run check-env
      - name: Validate migrations
        run: npm run check-migrations
      - name: Check circular dependencies
        run: npm run lint:deps
      - name: Verify completed callable source checkout
        if: ${{ inputs.profile == 'full' || inputs.profile == 'nightly' }}
        shell: /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS -u LD_PRELOAD -u LD_LIBRARY_PATH /bin/bash --noprofile --norc -p -e -o pipefail {0}
        env:
          BASH_ENV: ""
          ENV: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          LD_ORIGIN_PATH: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
          PYTHONSTARTUP: ""
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I - <<'PY'
          import os,re,stat,subprocess,hashlib
          from pathlib import Path
          root=Path.cwd().resolve()
          expected=os.environ.get('SOURCE_SHA','')
