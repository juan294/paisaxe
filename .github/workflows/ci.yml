    if: ${{ always() && !(inputs.profile == '' && inputs.source_sha == '' && inputs.invocation_id == '' && (github.event_name == 'push' || github.event_name == 'pull_request') && github.workflow_ref == format('juan294/paisaxe/.github/workflows/ci.yml@{0}', github.ref)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Require all callable CI children
        env:
          SOURCE_RESULT: ${{ needs.callable-source.result }}
          LINT_RESULT: ${{ needs.lint-and-typecheck.result }}
          SHARD_RESULT: ${{ needs.coverage-shard.result }}
          MERGE_RESULT: ${{ needs.coverage-merge.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          for result in "$SOURCE_RESULT" "$LINT_RESULT" "$SHARD_RESULT" "$MERGE_RESULT" "$TEST_RESULT" "$BUILD_RESULT"; do
