name: Bundle Size Analysis
on:
  pull_request:
    branches:
      - develop
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Analyze Bundle Size
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          ANTHROPIC_API_KEY: dummy_key_for_build
          VOYAGE_API_KEY: dummy_key_for_build
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_key_for_build
      - name: Analyze bundle
        id: bundle
        run: |
          echo "## Bundle Size Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Directory | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|------|" >> "$GITHUB_STEP_SUMMARY"

          if [ -d ".next/static" ]; then
            STATIC_SIZE=$(du -sh .next/static | cut -f1)
            echo "| \`.next/static\` | $STATIC_SIZE |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -d ".next/server" ]; then
            SERVER_SIZE=$(du -sh .next/server | cut -f1)
            echo "| \`.next/server\` | $SERVER_SIZE |" >> "$GITHUB_STEP_SUMMARY"
          fi

          TOTAL_SIZE=$(du -sh .next | cut -f1)
          echo "| **Total \`.next\`** | **$TOTAL_SIZE** |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Largest JS bundles" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find .next -name "*.js" -type f -exec du -h {} + | sort -rh | head -20 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # Save values for PR comment
          echo "static_size=${STATIC_SIZE:-N/A}" >> "$GITHUB_OUTPUT"
          echo "server_size=${SERVER_SIZE:-N/A}" >> "$GITHUB_OUTPUT"
          echo "total_size=${TOTAL_SIZE}" >> "$GITHUB_OUTPUT"
      - name: Enforce per-route bundle budget
        id: budget
        run: npm run check-bundle-budget
    outputs:
      static_size: ${{ steps.bundle.outputs.static_size }}
      server_size: ${{ steps.bundle.outputs.server_size }}
      total_size: ${{ steps.bundle.outputs.total_size }}
      budget_outcome: ${{ steps.budget.outcome }}
    if: ${{ always() && (!(vars.CI_CADENCE_MODE == 'lean' && github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && ((github.event_name == 'schedule' && github.ref == 'refs/heads/main') || (github.actor_id == '3944118' && github.event.sender.type == 'User' && ((github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'develop' && github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326)))))) && (!failure() && !cancelled()) }}
  bundle-comment:
    name: Publish owner bundle comment
    needs:
      - analyze
    if: ${{ always() && (!(vars.CI_CADENCE_MODE == 'lean' && github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && ((github.event_name == 'schedule' && github.ref == 'refs/heads/main') || (github.actor_id == '3944118' && github.event.sender.type == 'User' && ((github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'develop' && github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326)))))) && (always() && github.event_name == 'pull_request' && github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326))))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Comment on PR
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const staticSize = '${{ needs.analyze.outputs.static_size }}';
            const serverSize = '${{ needs.analyze.outputs.server_size }}';
            const totalSize = '${{ needs.analyze.outputs.total_size }}';
            const budgetOutcome = '${{ needs.analyze.outputs.budget_outcome }}' === 'success' ? '✅ within budget' : '❌ budget exceeded — see job logs';

            const body = [
              '## Bundle Size Report',
              '',
              '| Directory | Size |',
              '|-----------|------|',
              `| \`.next/static\` | ${staticSize} |`,
              `| \`.next/server\` | ${serverSize} |`,
              `| **Total \`.next\`** | **${totalSize}** |`,
              '',
              `**Per-route gzip budget:** ${budgetOutcome}`,
              '',
              `> Measured at commit ${context.sha.substring(0, 7)}`,
            ].join('\n');

            // Find existing comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '## Bundle Size Report';
            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
