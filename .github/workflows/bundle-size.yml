name: Bundle Size Analysis
on:
  pull_request:
    branches:
      - develop
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  routing:
    name: Sutura routing
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    outputs:
      full: ${{ steps.plan.outputs.full }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Plan automatic verification
        id: plan
        shell: bash
        run: |-
          set -euo pipefail
          # Ignore ambient Git redirection and never execute a candidate routing helper.
          for name in ${!GIT_@}; do unset "$name"; done
          git_read() { git --no-replace-objects -c core.hooksPath=/dev/null -c core.fsmonitor=false "$@"; }
          printf 'full=true\n' >> "$GITHUB_OUTPUT"
          base=""
          case "$GITHUB_EVENT_NAME" in
            push) base=$(jq -r '.before' "$GITHUB_EVENT_PATH") ;;
            pull_request)
              head=$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")
              test "$(git_read rev-parse HEAD^2)" = "$head" || { echo 'Sutura: PR head/merge parent mismatch' >&2; exit 1; }
              base=$(git_read rev-parse HEAD^1)
              ;;
            *) base=$(git_read rev-parse HEAD) ;;
          esac
          [[ "$base" =~ ^[0-9a-f]{40}$ && "$base" != 0000000000000000000000000000000000000000 ]] || { echo 'Sutura: protected base unavailable; full verification remains required. Bring this run to Sutura.' >&2; exit 1; }
          protected=$(mktemp -d)
          trap 'status=$?; if [ "$status" -ne 0 ]; then printf "full=true\n" >> "$GITHUB_OUTPUT"; fi; rm -rf "$protected"; exit "$status"' EXIT
          if git_read cat-file -e "$base:scripts/ci-routing-v2.mjs" 2>/dev/null; then
            git_read show "$base:scripts/ci-routing-v2.mjs" > "$protected/ci-routing-v2.mjs"
            node "$protected/ci-routing-v2.mjs" --base "$base"
          else
            printf 'reason=installation-missing\n' >> "$GITHUB_OUTPUT"
            echo 'Sutura protected routing v2 is not installed yet. Running full verification automatically; no mode change is needed.'
          fi
  analyze:
    name: Analyze Bundle Size
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          ANTHROPIC_API_KEY: dummy_key_for_build
          VOYAGE_API_KEY: dummy_key_for_build
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_key_for_build
      - name: Analyze bundle
        id: bundle
        run: |
          echo "## Bundle Size Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Directory | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|------|" >> "$GITHUB_STEP_SUMMARY"

          if [ -d ".next/static" ]; then
            STATIC_SIZE=$(du -sh .next/static | cut -f1)
            echo "| \`.next/static\` | $STATIC_SIZE |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -d ".next/server" ]; then
            SERVER_SIZE=$(du -sh .next/server | cut -f1)
            echo "| \`.next/server\` | $SERVER_SIZE |" >> "$GITHUB_STEP_SUMMARY"
          fi

          TOTAL_SIZE=$(du -sh .next | cut -f1)
          echo "| **Total \`.next\`** | **$TOTAL_SIZE** |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Largest JS bundles" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find .next -name "*.js" -type f -exec du -h {} + | sort -rh | head -20 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # Save values for PR comment
          echo "static_size=${STATIC_SIZE:-N/A}" >> "$GITHUB_OUTPUT"
          echo "server_size=${SERVER_SIZE:-N/A}" >> "$GITHUB_OUTPUT"
          echo "total_size=${TOTAL_SIZE}" >> "$GITHUB_OUTPUT"
      - name: Enforce per-route bundle budget
        id: budget
        run: npm run check-bundle-budget
    outputs:
      static_size: ${{ steps.bundle.outputs.static_size }}
      server_size: ${{ steps.bundle.outputs.server_size }}
      total_size: ${{ steps.bundle.outputs.total_size }}
      budget_outcome: ${{ steps.budget.outcome }}
    if: ${{ always() && ((false) || (!(github.event_name == 'schedule' && needs.routing.result == 'success' && needs.routing.outputs.reason != 'installation-missing') && (needs.routing.result != 'success' || needs.routing.outputs.full != 'false' || (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.actor_id != '3944118' || (github.event_name == 'pull_request' && (github.event.pull_request.user.id != 3944118 || github.event.pull_request.head.repo.id != github.event.repository.id)) || ((github.event_name == 'push' && github.event.head_commit.author.username != 'juan294')))))) && (always() && (true)) }}
    needs:
      - routing
  bundle-comment:
    name: Publish owner bundle comment
    needs:
      - analyze
      - routing
    if: ${{ always() && ((false) || (!(github.event_name == 'schedule' && needs.routing.result == 'success' && needs.routing.outputs.reason != 'installation-missing') && (needs.routing.result != 'success' || needs.routing.outputs.full != 'false' || (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.actor_id != '3944118' || (github.event_name == 'pull_request' && (github.event.pull_request.user.id != 3944118 || github.event.pull_request.head.repo.id != github.event.repository.id)) || ((github.event_name == 'push' && github.event.head_commit.author.username != 'juan294')))))) && (always() && (always() && github.event_name == 'pull_request' && github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326)))))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Comment on PR
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const staticSize = '${{ needs.analyze.outputs.static_size }}';
            const serverSize = '${{ needs.analyze.outputs.server_size }}';
            const totalSize = '${{ needs.analyze.outputs.total_size }}';
            const budgetOutcome = '${{ needs.analyze.outputs.budget_outcome }}' === 'success' ? '✅ within budget' : '❌ budget exceeded — see job logs';

            const body = [
              '## Bundle Size Report',
              '',
              '| Directory | Size |',
              '|-----------|------|',
              `| \`.next/static\` | ${staticSize} |`,
              `| \`.next/server\` | ${serverSize} |`,
              `| **Total \`.next\`** | **${totalSize}** |`,
              '',
              `**Per-route gzip budget:** ${budgetOutcome}`,
              '',
              `> Measured at commit ${context.sha.substring(0, 7)}`,
            ].join('\n');

            // Find existing comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '## Bundle Size Report';
            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
  ci-verification:
    name: CI Verification (Bundle Size Analysis)
    needs:
      - routing
      - analyze
    if: ${{ always() && !(false) && !(github.event_name == 'schedule' && needs.routing.result == 'success' && needs.routing.outputs.reason != 'installation-missing') && (needs.routing.result != 'success' || needs.routing.outputs.full != 'false' || (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.actor_id != '3944118' || (github.event_name == 'pull_request' && (github.event.pull_request.user.id != 3944118 || github.event.pull_request.head.repo.id != github.event.repository.id)) || ((github.event_name == 'push' && github.event.head_commit.author.username != 'juan294')))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require actual application children
        env:
          NEEDS: ${{ toJSON(needs) }}
          FORCE_FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.actor_id != '3944118' || (github.event_name == 'pull_request' && (github.event.pull_request.user.id != 3944118 || github.event.pull_request.head.repo.id != github.event.repository.id)) || ((github.event_name == 'push' && github.event.head_commit.author.username != 'juan294')) }}
        run: |-
          node --input-type=module <<'SUTURA_GATE'
          const needs = JSON.parse(process.env.NEEDS);
          const route = needs.routing;
          if (route?.result !== 'success' || !['true', 'false'].includes(route?.outputs?.full)) {
            console.error('Sutura routing failed or is missing; repair the protected routing installation. Full verification remains required.');
            process.exit(1);
          }
          if (route.outputs.full === 'false' && process.env.FORCE_FULL !== 'true') process.exit(0);
          const required = ["analyze"];
          const failed = required.filter(job => needs[job]?.result !== 'success');
          for (const job of failed) console.error(job + ': expected actual application success, received ' + (needs[job]?.result ?? 'missing'));
          if (failed.length) process.exit(1);
          console.log('Sutura application verification passed. Release/provider proof remains separate.');
          SUTURA_GATE
permissions:
  contents: read
  actions: read
