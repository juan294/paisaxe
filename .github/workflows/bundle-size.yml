name: Bundle Size Analysis
on:
  pull_request:
    branches:
      - develop
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Analyze Bundle Size
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          ANTHROPIC_API_KEY: dummy_key_for_build
          VOYAGE_API_KEY: dummy_key_for_build
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_key_for_build
      - name: Analyze bundle
        id: bundle
        run: |
          echo "## Bundle Size Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Directory | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|------|" >> "$GITHUB_STEP_SUMMARY"

          if [ -d ".next/static" ]; then
            STATIC_SIZE=$(du -sh .next/static | cut -f1)
            echo "| \`.next/static\` | $STATIC_SIZE |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -d ".next/server" ]; then
            SERVER_SIZE=$(du -sh .next/server | cut -f1)
            echo "| \`.next/server\` | $SERVER_SIZE |" >> "$GITHUB_STEP_SUMMARY"
          fi

          TOTAL_SIZE=$(du -sh .next | cut -f1)
          echo "| **Total \`.next\`** | **$TOTAL_SIZE** |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Largest JS bundles" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find .next -name "*.js" -type f -exec du -h {} + | sort -rh | head -20 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # Save values for PR comment
          echo "static_size=${STATIC_SIZE:-N/A}" >> "$GITHUB_OUTPUT"
          echo "server_size=${SERVER_SIZE:-N/A}" >> "$GITHUB_OUTPUT"
          echo "total_size=${TOTAL_SIZE}" >> "$GITHUB_OUTPUT"
      - name: Enforce per-route bundle budget
        id: budget
        run: npm run check-bundle-budget
    outputs:
      static_size: ${{ steps.bundle.outputs.static_size }}
      server_size: ${{ steps.bundle.outputs.server_size }}
      total_size: ${{ steps.bundle.outputs.total_size }}
      budget_outcome: ${{ steps.budget.outcome }}
    needs:
      - cadence-route
    if: ${{ always() && (!(vars.CI_CADENCE_MODE == 'lean' && github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && github.actor_id == '3944118' && github.event.sender.type == 'User' && ((github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'develop' && github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326) || (github.event_name == 'schedule' && github.ref == 'refs/heads/main'))) || needs.cadence-route.outputs.run_legacy == 'true') && (!failure() && !cancelled()) }}
  bundle-comment:
    name: Publish owner bundle comment
    needs:
      - analyze
      - cadence-route
    if: ${{ always() && (!(vars.CI_CADENCE_MODE == 'lean' && github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && github.actor_id == '3944118' && github.event.sender.type == 'User' && ((github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'develop' && github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326) || (github.event_name == 'schedule' && github.ref == 'refs/heads/main'))) || needs.cadence-route.outputs.run_legacy == 'true') && (always() && github.event_name == 'pull_request' && github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Comment on PR
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const staticSize = '${{ needs.analyze.outputs.static_size }}';
            const serverSize = '${{ needs.analyze.outputs.server_size }}';
            const totalSize = '${{ needs.analyze.outputs.total_size }}';
            const budgetOutcome = '${{ needs.analyze.outputs.budget_outcome }}' === 'success' ? '✅ within budget' : '❌ budget exceeded — see job logs';

            const body = [
              '## Bundle Size Report',
              '',
              '| Directory | Size |',
              '|-----------|------|',
              `| \`.next/static\` | ${staticSize} |`,
              `| \`.next/server\` | ${serverSize} |`,
              `| **Total \`.next\`** | **${totalSize}** |`,
              '',
              `**Per-route gzip budget:** ${budgetOutcome}`,
              '',
              `> Measured at commit ${context.sha.substring(0, 7)}`,
            ].join('\n');

            // Find existing comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '## Bundle Size Report';
            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
  cadence-route:
    name: Protected cadence routing
    if: ${{ vars.CI_CADENCE_MODE == 'lean' && github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && github.actor_id == '3944118' && github.event.sender.type == 'User' && ((github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'develop' && github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326) || (github.event_name == 'schedule' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      run_legacy: ${{ steps.route.outputs.run_legacy }}
    steps:
      - name: Checkout actual native event
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup reviewed Node runtime
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Classify protected native routing
        id: route
        env:
          CI_CADENCE_MODE: ${{ vars.CI_CADENCE_MODE }}
          NODE_OPTIONS: ""
          NODE_PATH: ""
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unset NODE_OPTIONS NODE_PATH
          node --input-type=module <<'NODE'
          import {readFile,mkdtemp,writeFile,rm} from 'node:fs/promises';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {tmpdir} from 'node:os';
          import {join} from 'node:path';
          import {pathToFileURL} from 'node:url';
          const event=JSON.parse(await readFile(process.env.GITHUB_EVENT_PATH,'utf8'));
          let runLegacy=true,temporary;
          try{
          const kind=process.env.GITHUB_EVENT_NAME;
          if(process.env.CI_CADENCE_MODE==='lean'&&['push','pull_request','schedule'].includes(kind)){
          const revision=kind==='push'?event.before:kind==='schedule'?process.env.GITHUB_SHA:event.pull_request?.base?.sha;
          if(!/^[a-f0-9]{40}$/.test(revision??'')||revision==='0'.repeat(40))throw Error('Native routing revision');
          const env={PATH:'/usr/bin:/bin',GIT_CONFIG_NOSYSTEM:'1',GIT_CONFIG_GLOBAL:'/dev/null',GIT_GRAFT_FILE:'/dev/null',GIT_NO_REPLACE_OBJECTS:'1'};
          const git=(...args)=>execFileSync('/usr/bin/git',['--no-replace-objects','-c','core.hooksPath=/dev/null','-c','core.fsmonitor=false',...args],{env,timeout:5000,maxBuffer:2000000});
          if(!['https://github.com/juan294/paisaxe.git','https://github.com/juan294/paisaxe'].includes(git('remote','get-url','origin').toString().trim()))throw Error('Routing origin');
          if(kind==='push')git('update-ref','refs/ci-cadence/protected/'+revision,revision);
          const entry=git('ls-tree',revision,'--','scripts/ci-cadence-native.mjs').toString();
          const present=git('ls-tree','--name-only','-z',revision,'--','scripts/ci-cadence.mjs','.github/ci-cadence.json').toString().split('\0').filter(Boolean);
          // Genuine first installation retains the original context graph, with no
          // candidate import. Partial/unknown installation also retains full work.
          if(present.length===2){
          if(!/^100(?:644|755) blob [a-f0-9]{40}\t/.test(entry))throw Error('Routing module mode');
          const bytes=git('show',revision+':scripts/ci-cadence-native.mjs');
          if(createHash('sha256').update(bytes).digest('hex')!=='95d90114925026bc3f5ea7f978080376625241bfece4971de9b906e8bba528b1')throw Error('Routing reviewed bytes');
          temporary=await mkdtemp(join(tmpdir(),'B-protected-route-'));
          if(kind==='schedule'){
          if(!/^100(?:644|755) blob [a-f0-9]{40}\t/.test(git('ls-tree',revision,'--','scripts/ci-cadence-launch.mjs').toString()))throw Error('Routing launcher mode');
          const launch=git('show',revision+':scripts/ci-cadence-launch.mjs');
          if(createHash('sha256').update(launch).digest('hex')!=='7af2cc34293872b4eb35f3b54649e85936a86ba5baa4fcc15b208858151e3216')throw Error('Routing launcher reviewed bytes');
          await writeFile(join(temporary,'launch.mjs'),launch,{flag:'wx',mode:0o600});
          const result=JSON.parse(execFileSync(process.execPath,[join(temporary,'launch.mjs')],{env:{...process.env,NODE_OPTIONS:'',NODE_PATH:''},timeout:65000,maxBuffer:2000000,stdio:['ignore','pipe','pipe']}).toString());
          runLegacy=!(result.lane==='nightly'&&result.protectedImported===true&&result.allowDeploy===false);
          }else{
          await writeFile(join(temporary,'native.mjs'),bytes,{flag:'wx',mode:0o600});
          const native=await import(pathToFileURL(join(temporary,'native.mjs')).href);
          const integer=value=>/^[1-9][0-9]*$/.test(value??'')?Number(value):NaN;
          const result=await native.classifyNativeEvent({root:process.cwd(),event,eventName:kind,actor:process.env.GITHUB_ACTOR,mode:process.env.CI_CADENCE_MODE,trustedRevision:revision,context:{repository:process.env.GITHUB_REPOSITORY,repositoryId:integer(process.env.GITHUB_REPOSITORY_ID),ownerId:integer(process.env.GITHUB_REPOSITORY_OWNER_ID),actorId:integer(process.env.GITHUB_ACTOR_ID),actorType:event.sender?.type,sha:process.env.GITHUB_SHA,ref:process.env.GITHUB_REF}});
          runLegacy=result.lane!=='fast';
          }}}
          }catch{runLegacy=true;}finally{if(temporary)await rm(temporary,{recursive:true,force:true});}
          await writeFile(process.env.GITHUB_OUTPUT,'run_legacy='+String(runLegacy)+'\n',{flag:'a'});
          NODE
