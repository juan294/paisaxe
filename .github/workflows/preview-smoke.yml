name: Release artifact smoke

# Native definition/YAML review is the pre-import trust boundary. This local
# production artifact gate makes no Vercel deployment/runtime assertion.
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview-smoke:
    name: Release artifact smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Preserve original physical PR merge
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup reviewed bootstrap Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - name: Acquire protected local artifact smoke before candidate code
        shell: /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS -u LD_PRELOAD -u LD_LIBRARY_PATH /bin/bash --noprofile --norc -p -e -o pipefail {0}
        env:
          BASH_ENV: ''
          ENV: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          LD_ORIGIN_PATH: ''
          NODE_OPTIONS: ''
          NODE_PATH: ''
          GITHUB_TOKEN: ${{ github.token }}
          candidate_sha: ${{ github.sha }}
          base_sha: ${{ github.event.pull_request.base.sha }}
          head_sha: ${{ github.event.pull_request.head.sha }}
          CI_CADENCE_SMOKE_EVIDENCE: ${{ runner.temp }}/B-release-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          while IFS= read -r name; do unset "$name"; done < <(compgen -v | /usr/bin/sed -n '/^GIT_/p')
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_NO_REPLACE_OBJECTS=1 GIT_GRAFT_FILE=/dev/null
          [[ "$base_sha" =~ ^[a-f0-9]{40}$ ]]
          private="$(mktemp -d "$RUNNER_TEMP/B-smoke-launch.XXXXXXXX")"
          chmod 700 "$private"
          trap 'rm -rf "$private"' EXIT
          /usr/bin/git --no-replace-objects -c core.hooksPath=/dev/null -c core.fsmonitor=false show "$base_sha:scripts/ci-cadence-smoke-launch.mjs" > "$private/ci-cadence-smoke-launch.mjs"
          printf '%s  %s\n' '918e58b16abeae1d511c2d28b811c1599d86ef6d67fde6c81a9e9e54012f0f65' "$private/ci-cadence-smoke-launch.mjs" | /usr/bin/sha256sum --check --status
          node "$private/ci-cadence-smoke-launch.mjs"
