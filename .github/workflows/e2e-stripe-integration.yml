name: Stripe E2E Integration

on:
  # The former live-gate input is gone: missing secrets now always fail, so a
  # knob that chose between "fail" and "silently pass" no longer has a
  # meaningful setting.
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    paths:
      - 'src/app/api/checkout/**'
      - 'src/app/api/webhooks/stripe/**'
      - 'src/lib/stripe.ts'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e-stripe:
    name: Real Stripe Checkout
    if: ${{ github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326 && github.event.pull_request.head.repo.fork == false)))) }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Check required secrets
        id: secrets
        env:
          STRIPE_TEST_SECRET_KEY: ${{ github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326 && github.event.pull_request.head.repo.fork == false)))) && secrets.STRIPE_TEST_SECRET_KEY || '' }}
          STRIPE_TEST_DAY_PASS_PRICE_ID: ${{ github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326 && github.event.pull_request.head.repo.fork == false)))) && secrets.STRIPE_TEST_DAY_PASS_PRICE_ID || '' }}
          NEXT_PUBLIC_STRIPE_TEST_PUBLISHABLE_KEY: ${{ github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326 && github.event.pull_request.head.repo.fork == false)))) && secrets.NEXT_PUBLIC_STRIPE_TEST_PUBLISHABLE_KEY || '' }}
          STRIPE_TEST_WEBHOOK_SECRET: ${{ github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326 && github.event.pull_request.head.repo.fork == false)))) && secrets.STRIPE_TEST_WEBHOOK_SECRET || '' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326 && github.event.pull_request.head.repo.fork == false)))) && secrets.NEXT_PUBLIC_SUPABASE_URL || '' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326 && github.event.pull_request.head.repo.fork == false)))) && secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || '' }}
          SUPABASE_SERVICE_KEY: ${{ github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326 && github.event.pull_request.head.repo.fork == false)))) && secrets.SUPABASE_SERVICE_KEY || '' }}
          QA_TEST_USER_EMAIL: ${{ github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326 && github.event.pull_request.head.repo.fork == false)))) && secrets.QA_TEST_USER_EMAIL || '' }}
          QA_TEST_USER_PASSWORD: ${{ github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326 && github.event.pull_request.head.repo.fork == false)))) && secrets.QA_TEST_USER_PASSWORD || '' }}
        run: |
          missing=0
          for key in \
            STRIPE_TEST_SECRET_KEY \
            STRIPE_TEST_DAY_PASS_PRICE_ID \
            NEXT_PUBLIC_STRIPE_TEST_PUBLISHABLE_KEY \
            STRIPE_TEST_WEBHOOK_SECRET \
            NEXT_PUBLIC_SUPABASE_URL \
            NEXT_PUBLIC_SUPABASE_ANON_KEY \
            SUPABASE_SERVICE_KEY \
            QA_TEST_USER_EMAIL \
            QA_TEST_USER_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "Missing required secret: $key"
              missing=1
            fi
          done

          # A missing secret always fails, with no opt-out.
          # Previously this exited 0, so the job reported success having run
          # zero tests — a green check that proved nothing. Requiredness is not
          # satisfiable without evidence; if the secrets are not configured, say
          # so loudly rather than banking an unearned pass.
          if [ "$missing" -eq 1 ]; then
            echo "::error::Stripe integration secrets are not configured; refusing to report success without running any test."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Install canvas system dependencies
        uses: ./.github/actions/install-canvas-deps

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run real Stripe checkout integration
        env:
          ANTHROPIC_API_KEY: dummy_key_for_e2e
          VOYAGE_API_KEY: dummy_key_for_e2e
          MAINTENANCE_MODE: "false"
          STRIPE_TEST_SECRET_KEY: ${{ github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326 && github.event.pull_request.head.repo.fork == false)))) && secrets.STRIPE_TEST_SECRET_KEY || '' }}
          STRIPE_TEST_DAY_PASS_PRICE_ID: ${{ github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326 && github.event.pull_request.head.repo.fork == false)))) && secrets.STRIPE_TEST_DAY_PASS_PRICE_ID || '' }}
          NEXT_PUBLIC_STRIPE_TEST_PUBLISHABLE_KEY: ${{ github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326 && github.event.pull_request.head.repo.fork == false)))) && secrets.NEXT_PUBLIC_STRIPE_TEST_PUBLISHABLE_KEY || '' }}
          STRIPE_TEST_WEBHOOK_SECRET: ${{ github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326 && github.event.pull_request.head.repo.fork == false)))) && secrets.STRIPE_TEST_WEBHOOK_SECRET || '' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326 && github.event.pull_request.head.repo.fork == false)))) && secrets.NEXT_PUBLIC_SUPABASE_URL || '' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326 && github.event.pull_request.head.repo.fork == false)))) && secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || '' }}
          SUPABASE_SERVICE_KEY: ${{ github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326 && github.event.pull_request.head.repo.fork == false)))) && secrets.SUPABASE_SERVICE_KEY || '' }}
          QA_TEST_USER_EMAIL: ${{ github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326 && github.event.pull_request.head.repo.fork == false)))) && secrets.QA_TEST_USER_EMAIL || '' }}
          QA_TEST_USER_PASSWORD: ${{ github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326 && github.event.pull_request.head.repo.fork == false)))) && secrets.QA_TEST_USER_PASSWORD || '' }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/stripe-e2e-report.json
        run: npm run test:e2e:stripe

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-stripe
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 14
