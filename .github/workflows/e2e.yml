name: E2E Tests
on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  routing:
    name: Sutura routing
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    outputs:
      full: ${{ steps.plan.outputs.full }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Plan automatic verification
        id: plan
        shell: bash
        run: |-
          set -euo pipefail
          # Ignore ambient Git redirection and never execute a candidate routing helper.
          for name in ${!GIT_@}; do unset "$name"; done
          git_read() { git --no-replace-objects -c core.hooksPath=/dev/null -c core.fsmonitor=false "$@"; }
          printf 'full=true\n' >> "$GITHUB_OUTPUT"
          base=""
          case "$GITHUB_EVENT_NAME" in
            push) base=$(jq -r '.before' "$GITHUB_EVENT_PATH") ;;
            pull_request)
              head=$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")
              test "$(git_read rev-parse HEAD^2)" = "$head" || { echo 'Sutura: PR head/merge parent mismatch' >&2; exit 1; }
              base=$(git_read rev-parse HEAD^1)
              ;;
            *) base=$(git_read rev-parse HEAD) ;;
          esac
          [[ "$base" =~ ^[0-9a-f]{40}$ && "$base" != 0000000000000000000000000000000000000000 ]] || { echo 'Sutura: protected base unavailable; full verification remains required. Bring this run to Sutura.' >&2; exit 1; }
          protected=$(mktemp -d)
          trap 'status=$?; if [ "$status" -ne 0 ]; then printf "full=true\n" >> "$GITHUB_OUTPUT"; fi; rm -rf "$protected"; exit "$status"' EXIT
          if git_read cat-file -e "$base:scripts/ci-routing-v2.mjs" 2>/dev/null; then
            git_read show "$base:scripts/ci-routing-v2.mjs" > "$protected/ci-routing-v2.mjs"
            node "$protected/ci-routing-v2.mjs" --base "$base"
          else
            printf 'reason=installation-missing\n' >> "$GITHUB_OUTPUT"
            echo 'Sutura protected routing v2 is not installed yet. Running full verification automatically; no mode change is needed.'
          fi
  develop_push_source:
    if: github.event_name == 'sutura-prior-proof-disabled'
    permissions:
      contents: read
      pull-requests: read
      checks: read
    uses: ./.github/workflows/validate-merged-pr.yml
    with:
      required_checks: '["Playwright E2E","Visual Regression"]'
  e2e:
    name: Playwright E2E
    needs:
      - develop_push_source
      - routing
    if: ${{ always() && ((false) || (!(github.event_name == 'schedule' && needs.routing.result == 'success' && needs.routing.outputs.reason != 'installation-missing') && (needs.routing.result != 'success' || needs.routing.outputs.full != 'false' || (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.actor_id != '3944118' || (github.event_name == 'pull_request' && (github.event.pull_request.user.id != 3944118 || github.event.pull_request.head.repo.id != github.event.repository.id)) || ((github.event_name == 'push' && github.event.head_commit.author.username != 'juan294')))))) && (always() && (always() && true)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PLAYWRIGHT_CHROME_CHANNEL: chrome
      SECRETS_WITHHELD_PR: |-
        ${{ !(github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326))))) || (github.event_name == 'pull_request' &&
          (github.event.pull_request.head.repo.fork == true ||
           github.event.pull_request.user.login == 'dependabot[bot]')) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Check authenticated QA secrets
        if: env.SECRETS_WITHHELD_PR != 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326)))) && secrets.NEXT_PUBLIC_SUPABASE_URL || '' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326)))) && secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || '' }}
          SUPABASE_SERVICE_KEY: ${{ github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326)))) && secrets.SUPABASE_SERVICE_KEY || '' }}
          QA_TEST_USER_EMAIL: ${{ github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326)))) && secrets.QA_TEST_USER_EMAIL || '' }}
          QA_TEST_USER_PASSWORD: ${{ github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326)))) && secrets.QA_TEST_USER_PASSWORD || '' }}
        run: |
          for key in \
            NEXT_PUBLIC_SUPABASE_URL \
            NEXT_PUBLIC_SUPABASE_ANON_KEY \
            SUPABASE_SERVICE_KEY \
            QA_TEST_USER_EMAIL \
            QA_TEST_USER_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "Missing required secret: ${key}" >&2
              exit 1
            fi
          done
      - name: Install canvas system dependencies
        uses: ./.github/actions/install-canvas-deps
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright system dependencies
        timeout-minutes: 10
        run: npx playwright install-deps chromium
      - name: Verify system Chrome
        run: google-chrome --version
      - name: Build application
        run: npm run build
        env:
          ANTHROPIC_API_KEY: dummy_key_for_build
          VOYAGE_API_KEY: dummy_key_for_build
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_key_for_build
      - name: Run E2E tests with authenticated journey
        if: env.SECRETS_WITHHELD_PR != 'true'
        run: npm run test:e2e
        env:
          CI: true
          ANTHROPIC_API_KEY: dummy_key_for_e2e
          VOYAGE_API_KEY: dummy_key_for_e2e
          NEXT_PUBLIC_SUPABASE_URL: ${{ github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326)))) && secrets.NEXT_PUBLIC_SUPABASE_URL || '' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326)))) && secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || '' }}
          SUPABASE_SERVICE_KEY: ${{ github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326)))) && secrets.SUPABASE_SERVICE_KEY || '' }}
          MAINTENANCE_MODE: "false"
          STRIPE_SECRET_KEY: sk_test_dummy_for_e2e
          STRIPE_DAY_PASS_PRICE_ID: price_test_dummy_for_e2e
          QA_TEST_USER_EMAIL: ${{ github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326)))) && secrets.QA_TEST_USER_EMAIL || '' }}
          QA_TEST_USER_PASSWORD: ${{ github.repository_id == '1141286326' && github.repository_owner_id == '3944118' && (github.event_name == 'schedule' || (github.actor_id == '3944118' && github.event.sender.type == 'User' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 3944118 && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.id == 1141286326)))) && secrets.QA_TEST_USER_PASSWORD || '' }}
      - name: Run E2E tests without secret-backed authenticated journey
        if: env.SECRETS_WITHHELD_PR == 'true'
        run: 'npm run test:e2e -- --grep-invert="QA Journey: Authenticated User"'
        env:
          CI: true
          ANTHROPIC_API_KEY: dummy_key_for_e2e
          VOYAGE_API_KEY: dummy_key_for_e2e
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_key_for_e2e
          MAINTENANCE_MODE: "false"
          STRIPE_SECRET_KEY: sk_test_dummy_for_e2e
          STRIPE_DAY_PASS_PRICE_ID: price_test_dummy_for_e2e
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
    permissions:
      contents: read
  visual-regression:
    name: Visual Regression
    needs:
      - develop_push_source
      - routing
    if: ${{ always() && ((false) || (!(github.event_name == 'schedule' && needs.routing.result == 'success' && needs.routing.outputs.reason != 'installation-missing') && (needs.routing.result != 'success' || needs.routing.outputs.full != 'false' || (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.actor_id != '3944118' || (github.event_name == 'pull_request' && (github.event.pull_request.user.id != 3944118 || github.event.pull_request.head.repo.id != github.event.repository.id)) || ((github.event_name == 'push' && github.event.head_commit.author.username != 'juan294')))))) && (always() && (always() && true)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install canvas system dependencies
        uses: ./.github/actions/install-canvas-deps
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Build application
        run: npm run build
        env:
          ANTHROPIC_API_KEY: dummy_key_for_build
          VOYAGE_API_KEY: dummy_key_for_build
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_key_for_build
      - name: Run visual regression tests
        run: npm run test:e2e:visual
        env:
          CI: true
          ANTHROPIC_API_KEY: dummy_key_for_e2e
          VOYAGE_API_KEY: dummy_key_for_e2e
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_key_for_e2e
          MAINTENANCE_MODE: "false"
          STRIPE_SECRET_KEY: sk_test_dummy_for_e2e
          STRIPE_DAY_PASS_PRICE_ID: price_test_dummy_for_e2e
      - name: Upload visual diff artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: visual-regression-results
          path: test-results/
          retention-days: 14
    permissions:
      contents: read
  ci-verification:
    name: CI Verification (E2E Tests)
    needs:
      - routing
      - visual-regression
    if: ${{ always() && !(false) && !(github.event_name == 'schedule' && needs.routing.result == 'success' && needs.routing.outputs.reason != 'installation-missing') && (needs.routing.result != 'success' || needs.routing.outputs.full != 'false' || (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.actor_id != '3944118' || (github.event_name == 'pull_request' && (github.event.pull_request.user.id != 3944118 || github.event.pull_request.head.repo.id != github.event.repository.id)) || ((github.event_name == 'push' && github.event.head_commit.author.username != 'juan294')))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require actual application children
        env:
          NEEDS: ${{ toJSON(needs) }}
          FORCE_FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.actor_id != '3944118' || (github.event_name == 'pull_request' && (github.event.pull_request.user.id != 3944118 || github.event.pull_request.head.repo.id != github.event.repository.id)) || ((github.event_name == 'push' && github.event.head_commit.author.username != 'juan294')) }}
        run: |-
          node --input-type=module <<'SUTURA_GATE'
          const needs = JSON.parse(process.env.NEEDS);
          const route = needs.routing;
          if (route?.result !== 'success' || !['true', 'false'].includes(route?.outputs?.full)) {
            console.error('Sutura routing failed or is missing; repair the protected routing installation. Full verification remains required.');
            process.exit(1);
          }
          if (route.outputs.full === 'false' && process.env.FORCE_FULL !== 'true') process.exit(0);
          const required = ["visual-regression"];
          const failed = required.filter(job => needs[job]?.result !== 'success');
          for (const job of failed) console.error(job + ': expected actual application success, received ' + (needs[job]?.result ?? 'missing'));
          if (failed.length) process.exit(1);
          console.log('Sutura application verification passed. Release/provider proof remains separate.');
          SUTURA_GATE
      - name: Disclose withheld owner/provider proof
        run: echo 'Application verification excludes authenticated E2E and provider configuration proof when credentials are withheld. Release retains those prerequisites.' >> "$GITHUB_STEP_SUMMARY"
permissions:
  contents: read
  actions: read
